name: Boardo checks
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: boardo
          POSTGRES_PASSWORD: test-password
          POSTGRES_DB: boardo_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U boardo -d boardo_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://boardo:test-password@localhost:5432/boardo_test
      BOARDO_TEST_DATABASE_URL: postgresql://boardo:test-password@localhost:5432/boardo_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run db:deploy
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-results
          path: test-results/
